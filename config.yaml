app:
  name: 金融日报系统
  version: 2.0.0
  debug: false
database:
  url: sqlite:///./data/financial_daily.db
rsshub:
  base_url: http://101.42.187.241:1200
ai:
  provider: deepseek
  api_key: ${AI_API_KEY}
  base_url: ${AI_BASE_URL}
  model: ${AI_MODEL}
  prompts:
    article_summary: prompts/article_summary.txt
    daily_report: prompts/daily_report.txt
  temperature: 0.7
  max_tokens: 2000
  timeout: 300  # 超时时间增加到300秒（5分钟），确保长报告生成不会超时
  max_retries: 3
email:
  smtp_server: ${SMTP_SERVER}
  smtp_port: 465
  use_ssl: true
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from_name: 金融日报系统
scheduler:
  daily_report_time: 08:00
  timezone: Asia/Shanghai
report:
  generate_pdf: true
  show_pdf_in_frontend: false
  attach_pdf_in_email: false
logging:
  level: INFO
  file: logs/app.log
  max_bytes: 10485760
  backup_count: 5
firecrawl:
  api_key: ${FIRECRAWL_API_KEY}
  api_url: ${FIRECRAWL_API_URL}
  enabled: true
  timeout: 60
