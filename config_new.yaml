# 金融日报系统配置文件 - 更新版本

# 应用配置
app:
  name: "金融日报系统"
  version: "2.0.0"
  debug: false

# 数据库配置
database:
  url: "sqlite:///./data/financial_daily.db"

# RSSHub配置
rsshub:
  base_url: "http://101.42.187.241:1200"

# AI模型配置
ai:
  provider: "deepseek"
  api_key: "${AI_API_KEY}"
  base_url: "${AI_BASE_URL}"
  model: "${AI_MODEL}"
  prompts:
    article_summary: "prompts/article_summary.txt"
    daily_report: "prompts/daily_report.txt"
  temperature: 0.7
  max_tokens: 2000
  timeout: 120
  max_retries: 3

# 邮件配置
email:
  smtp_server: "${SMTP_SERVER}"
  smtp_port: 465
  use_ssl: true
  username: "${SMTP_USERNAME}"
  password: "${SMTP_PASSWORD}"
  from_name: "金融日报系统"

# 任务调度配置
scheduler:
  daily_report_time: "08:00"
  timezone: "Asia/Shanghai"

# 报告配置
report:
  generate_pdf: true
  show_pdf_in_frontend: false
  attach_pdf_in_email: false

# 日志配置
logging:
  level: "INFO"
  file: "logs/app.log"
  max_bytes: 10485760
  backup_count: 5

# Firecrawl配置
firecrawl:
  api_key: "${FIRECRAWL_API_KEY}"
  api_url: "${FIRECRAWL_API_URL}"
  enabled: true
  timeout: 60

